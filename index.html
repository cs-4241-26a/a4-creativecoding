<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Shape Shift</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap');

			:root {
				color-scheme: dark;
				font-family: 'DM Sans', sans-serif;
				background: #101624;
			}

			* { box-sizing: border-box; }
			body { margin: 0; overflow: hidden; background: #101624; }
			canvas { display: block; }

			.hud {
				position: fixed;
				inset: 0;
				z-index: 1;
				pointer-events: none;
				padding: 24px;
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
			}

			.panel {
				padding: 14px 18px;
				border: 1px solid rgba(255, 255, 255, .18);
				border-radius: 12px;
				background: rgba(9, 15, 37, .72);
				box-shadow: 0 12px 30px rgba(0, 0, 0, .16);
				backdrop-filter: blur(10px);
			}

			h1 { margin: 0 0 4px; font: 700 1.15rem 'Space Grotesk', sans-serif; letter-spacing: .02em; }
			p { margin: 0; color: #b9c4e5; font-size: .82rem; }
			#status { color: #72e1c1; font-weight: 700; }

			.help { text-align: right; line-height: 1.65; }
			kbd { padding: 2px 6px; border: 1px solid #65739a; border-radius: 4px; color: #fff; font-size: .72rem; }
			.selector { position: fixed; left: 50%; bottom: 28px; z-index: 2; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); gap: 8px; }
			button { border: 1px solid #52617e; border-radius: 8px; padding: 10px 16px; color: #dbe8ff; background: rgba(9, 15, 37, .84); font: 700 .8rem 'DM Sans', sans-serif; cursor: pointer; }
			button:hover, button.selected { border-color: #72e1c1; color: #101624; background: #72e1c1; }
			.builder { position: fixed; left: 50%; bottom: 88px; z-index: 2; transform: translateX(-50%); display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: calc(100vw - 24px); }
			.builder.visible { display: flex; }
			.builder label { display: flex; align-items: center; gap: 5px; color: #b9c4e5; font-size: .75rem; }
			select, input { width: 78px; border: 1px solid #52617e; border-radius: 6px; padding: 8px 6px; color: #fff; background: #18233a; font: 500 .78rem 'DM Sans', sans-serif; }
			select { width: 110px; }
			.builder button { padding: 8px 12px; }

			#rotation { color: #72e1c1; font-variant-numeric: tabular-nums; }
			.challenge { margin-top: 8px; color: #f7d774; }
			.stats { text-align: right; line-height: 1.65; }
			.stats strong { color: #72e1c1; }
		</style>
		<script type="importmap">
			{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
		</script>
	</head>
	<body>
		<div class="hud">
			<div class="panel">
						<h1>SHAPE SHIFT</h1>
						<p id="status">Select a shape, then rotate it</p>
						<p class="challenge" id="challenge">Target: --</p>
			</div>
			<div class="panel help">
						<p><kbd>W</kbd> <kbd>S</kbd> / <kbd>↑</kbd> <kbd>↓</kbd> pitch</p>
						<p><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> yaw</p>
						<p><kbd>SPACE</kbd> reset rotation</p>
						<div class="stats"><strong id="score">Score 0</strong> · <strong id="timer">15s</strong> · <strong id="level">Level 1</strong> · <strong id="streak">Streak 0</strong></div>
			</div>
		</div>
				<div class="panel selector" aria-label="Shape selection">
					<button class="selected" data-shape="cube">Cube</button>
					<button data-shape="tetrahedron">Tetrahedron</button>
					<button data-shape="octahedron">Octahedron</button>
					<button data-shape="sphere">Sphere</button>
					<button data-shape="cylinder">Cylinder</button>
					<button data-shape="torus">Torus</button>
					<button data-shape="custom">Custom</button>
					<button id="new-round" type="button">New round</button>
					<p id="rotation">0°</p>
		</div>
				<form class="panel builder" id="custom-builder">
					<label>Geometry <select id="custom-type">
						<option value="torus">Torus</option>
						<option value="box">Box</option>
						<option value="sphere">Sphere</option>
						<option value="cylinder">Cylinder</option>
						<option value="cone">Cone</option>
					</select></label>
					<label id="custom-size-label">Radius <input id="custom-size" type="number" min=".1" step=".1" value="1.25" /></label>
					<label id="custom-secondary-label">Tube <input id="custom-secondary" type="number" min=".1" step=".1" value=".45" /></label>
					<label>Segments <input id="custom-segments" type="number" min="3" max="64" step="1" value="24" /></label>
					<button type="submit">Create shape</button>
				</form>
		<script type="module" src="./main.js"></script>
	</body>
</html>
