<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Drift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <div class="panel-header">
          <span class="eyebrow">Creative Coding Demo</span>
          <h1>Neon Drift</h1>
        </div>

        <div id="docs" class="docs" aria-live="polite">
          <h2>How to use</h2>
          <ul>
            <li>Move your pointer to steer the particle field.</li>
            <li>Adjust the sliders to change motion, density, and color.</li>
            <li>Press the close button to hide this guide.</li>
          </ul>
        </div>

        <div class="controls">
          <label>
            <span>Particle count</span>
            <input id="particleCount" type="range" min="80" max="500" value="220" />
            <output id="particleCountValue">220</output>
          </label>

          <label>
            <span>Orbit speed</span>
            <input id="speed" type="range" min="0.5" max="4" step="0.1" value="1.8" />
            <output id="speedValue">1.8x</output>
          </label>

          <label>
            <span>Swirl force</span>
            <input id="swirl" type="range" min="0.1" max="3" step="0.1" value="1.7" />
            <output id="swirlValue">1.7</output>
          </label>

          <label>
            <span>Hue shift</span>
            <input id="hue" type="range" min="0" max="360" value="180" />
            <output id="hueValue">180°</output>
          </label>

          <label>
            <span>Trail fade</span>
            <input id="fade" type="range" min="0.05" max="0.24" step="0.01" value="0.14" />
            <output id="fadeValue">0.14</output>
          </label>
        </div>

        <button id="toggleDocs" type="button">Show instructions</button>
      </aside>

      <main class="viewport">
        <canvas id="scene"></canvas>
        <svg id="hud" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" aria-label="Interactive SVG overlay"></svg>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
